  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

      <a href=\"#buyers\" style=\"color:inherit\">買い手<\u002Fa>\n      <a href=\"#status\" style=\"color:inherit\">ステータス<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px\">\n      <a href=\"https://kotyzap.github.io/Sell-answers-not-video---x402-for-Axis/\" style=\"padding:4px 9px;border-radius:6px;color:var(--ink2)\">EN<\u002Fa>\n      <span style=\"padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--ink)\">日本語<\u002Fspan>\n      <a href=\"https://kotyzap.github.io/Sell-answers-not-video---x402-for-Axis/cs/\" style=\"padding:4px 9px;border-radius:6px;color:var(--ink2)\">Čeština<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section data-screen-label=\"Hero\" style=\"position:relative;max-width:1240px;margin:0 auto;padding:88px 24px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:center;min-height:78vh\">\n  <div style=\"position:relative;z-index:2\">\n    <div style=\"display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);margin-bottom:28px\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)\"><\u002Fspan>\n      実働プロトタイプ · CamWallet 0.8.2 · AXIS Q1656 · Base Sepolia\n    <\u002Fdiv>\n    <h1 style=\"font-size:clamp(40px,7.5vw,108px);line-height:0.98;letter-spacing:-0.035em;font-weight:800;text-wrap:balance\">売るのは x402 の答え、<br><span style=\"color:var(--accent-ink)\">AXIS の映像ではない。<\u002Fspan><\u002Fh1>\n    <p style=\"font-size:clamp(18px,1.6vw,23px);line-height:1.45;color:var(--ink2);max-width:560px;margin-top:30px;text-wrap:pretty\">CamWallet は AXIS カメラを x402 のセラーに変える ACAP です。エージェントはリクエストごとに支払い、狭く、プライバシーを最小化し、監査された答えを一つだけ受け取ります。カメラが鍵を持つことはありません。<\u002Fp>\n    <div style=\"display:flex;gap:12px;margin-top:38px;flex-wrap:wrap\">\n      <a href=\"#flow\" style=\"background:var(--ink);color:var(--bg);padding:15px 24px;border-radius:10px;font-weight:600;font-size:15px\">402 フローを見る<\u002Fa>\n      <a href=\"#guardrails\" style=\"border:1px solid var(--line);padding:15px 24px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink)\">ガードレールを読む<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:36px;margin-top:56px;flex-wrap:wrap\">\n      <div><div style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em\">0.002<\u002Fdiv><div style=\"font-size:13px;color:var(--ink2);font-family:'JetBrains Mono',monospace\">USDC / スナップショット<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em\">12<\u002Fdiv><div style=\"font-size:13px;color:var(--ink2);font-family:'JetBrains Mono',monospace\">Q1656 で見つかった販売可能ルール<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em\">0<\u002Fdiv><div style=\"font-size:13px;color:var(--ink2);font-family:'JetBrains Mono',monospace\">カメラ内の秘密鍵<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;min-height:420px\">\n    <div style=\"position:absolute;inset:8% 0 8% 10%;border-radius:32px;background:radial-gradient(ellipse at 60% 50%,var(--accent-soft),transparent 70%)\"><\u002Fdiv>\n    <div ref=\"{{ heroCamRef }}\" style=\"position:relative;will-change:transform\">\n      <img src=\"08367bf0-9d10-488d-9a14-0c50777825e7\" alt=\"壁面アームに取り付けた AXIS Q1656 ボックスカメラ\" style=\"width:100%;display:block;filter:drop-shadow(0 30px 40px oklch(0 0 0 / 0.25))\">\n    <\u002Fdiv>\n    <div ref=\"{{ heroTagRef }}\" style=\"position:absolute;left:4%;bottom:12%;background:var(--code-bg);color:var(--code-ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:14px 16px;border-radius:12px;box-shadow:0 20px 40px oklch(0 0 0 / 0.25);line-height:1.6;will-change:transform\">\n      <div style=\"color:var(--accent)\">HTTP/1.1 402 Payment Required<\u002Fdiv>\n      <div>accepts: USDC · base-sepolia · exact<\u002Fdiv>\n      <div style=\"opacity:.6\">price: 2000 · payTo: 0x54…e7b<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- THESIS BAND -->\n<section style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">テーゼ<\u002Fdiv>\n    <h2 style=\"grid-column:span 2;font-size:clamp(26px,3vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:700;text-wrap:balance\">AXIS カメラに価格表、ポリシーエンジン、そして安全な経済的インターフェースを与える。製品は署名された運用上の証拠であり、x402 はレジにすぎない。<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FLOW -->\n<section id=\"flow\" data-screen-label=\"Flow\" style=\"max-width:1240px;margin:0 auto;padding:110px 24px 80px\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">01 / x402 フローの仕組み<\u002Fdiv>\n  <h2 style=\"font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:820px;text-wrap:balance\">5 ホップ。答えは一つ。渡さなければ課金しない。<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:64px\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n      <div style=\"position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;min-height:230px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2)\"><span>{{ s.n }}<\u002Fspan><span style=\"color:var(--accent-ink)\">{{ s.tag }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:52px;font-weight:800;letter-spacing:-0.04em;line-height:1;color:var(--accent-ink);font-family:'JetBrains Mono',monospace\">{{ s.code }}<\u002Fdiv>\n        <h3 style=\"font-size:19px;font-weight:700;letter-spacing:-0.01em\">{{ s.title }}<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.55;color:var(--ink2);text-wrap:pretty\">{{ s.body }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:14px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 20px,transparent 20px 40px);animation:cwflow 1.2s linear infinite;opacity:.7\"><\u002Fdiv>\n  <pre style=\"margin:40px 0 0;background:var(--code-bg);color:var(--code-ink);border-radius:18px;padding:28px 30px;font-family:'JetBrains Mono',monospace;font-size:clamp(12px,1.15vw,15px);line-height:1.7;overflow-x:auto;white-space:pre\"><span style=\"color:var(--accent)\">GET<\u002Fspan> /local/camwallet/api/snapshot\n→ <span style=\"color:var(--warn)\">402 Payment Required<\u002Fspan>        accepts: USDC, base-sepolia, exact\n→ retry with <span style=\"color:var(--accent)\">PAYMENT-SIGNATURE<\u002Fspan>     EIP-3009 authorization, signed by the buyer\n→ <span style=\"color:var(--accent)\">200 image/jpeg<\u002Fspan> + PAYMENT-RESPONSE   <a href=\"https://sepolia.basescan.org/tx/0x54362605e831168521965331a87daabbc8b45fac9bc7c2a06ff873ff14e7b03f\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);text-decoration:underline;text-underline-offset:3px\">tx 0x54362605…14e7b03f ↗<\u002Fa><\u002Fpre>\n<\u002Fsection>\n\n<!-- ARCHITECTURE -->\n<section id=\"arch\" data-screen-label=\"Architecture\" style=\"background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;overflow:clip\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:110px 24px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">02 / カメラ → エージェント アーキテクチャ<\u002Fdiv>\n    <h2 style=\"font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:900px;text-wrap:balance\">エッジ優先、鍵なし、最大限に標準。<\u002Fh2>\n    <p style=\"font-size:18px;line-height:1.5;color:var(--ink2);max-width:640px;margin-top:22px;text-wrap:pretty\">402 の扉は ACAP そのもので、カメラ自身のウェブサーバー上で <code style=\"font-family:'JetBrains Mono',monospace;font-size:15px\">reverseProxy<\u002Fcode> を通じて提供される。追加のポートも追加の TLS も不要。検証と決済は第三者のファシリテーターが行い、ACAP は決済スタックを実装しない。一般的な x402 クライアントに、カメラのための特別扱いは要らない。<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:64px;align-items:stretch\">\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2)\">買い手<\u002Fdiv>\n        <h3 style=\"font-size:28px;font-weight:700;letter-spacing:-0.02em\">任意の x402 エージェント<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.55;color:var(--ink2)\">自分のウォレットを持つ。EIP-3009 の USDC 認可に署名する。呼ぶのは公開された<em>パス<\u002Fem>であって、カメラ側のターゲットではない。<\u002Fp>\n        <div style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-ink);padding:10px 12px;border-radius:10px;background:var(--accent-soft)\">PAYMENT-SIGNATURE →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--ink);color:var(--bg);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden\">\n        <div ref=\"{{ archCamRef }}\" style=\"position:absolute;right:-60px;bottom:-40px;width:320px;opacity:.28;will-change:transform\"><img src=\"9c4bf753-a5f9-410f-b690-cd4dee14e100\" alt=\"\" style=\"width:100%;display:block\"><\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.7;position:relative\">セラー · AXIS カメラ · FW12<\u002Fdiv>\n        <h3 style=\"font-size:28px;font-weight:700;letter-spacing:-0.02em;position:relative\">CamWallet ACAP<\u002Fh3>\n        <div style=\"display:grid;gap:8px;position:relative;font-size:14px;line-height:1.5\">\n          <div style=\"padding:10px 12px;border-radius:10px;background:oklch(1 0 0 / 0.08)\">カタログ · 既定は拒否、完全一致<\u002Fdiv>\n          <div style=\"padding:10px 12px;border-radius:10px;background:oklch(1 0 0 / 0.08)\">ポリシー · リース、クールダウン、レート制限、拒否リスト<\u002Fdiv>\n          <div style=\"padding:10px 12px;border-radius:10px;background:oklch(1 0 0 / 0.08)\">Producer · VAPIX · AOA · CamSwitcher · PTZ<\u002Fdiv>\n          <div style=\"padding:10px 12px;border-radius:10px;background:oklch(1 0 0 / 0.08)\">台帳 · カメラごとの JSONL、CSV エクスポート<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);position:relative\">保持するのは受取アドレスのみ · 秘密鍵なし<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2)\">決済<\u002Fdiv>\n        <h3 style=\"font-size:28px;font-weight:700;letter-spacing:-0.02em\">Facilitator + Base<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.55;color:var(--ink2)\"><code style=\"font-family:'JetBrains Mono',monospace\">/verify<\u002Fcode> then <code style=\"font-family:'JetBrains Mono',monospace\">/settle<\u002Fcode>. USDC は Base 上のオーナーのアドレスに着金する。ファシリテーターに到達できなければ → 402、何も提供せず、何も請求しない。<\u002Fp>\n        <div style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-ink);padding:10px 12px;border-radius:10px;background:var(--accent-soft)\">← tx ハッシュは PAYMENT-RESPONSE に<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:13px\">\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">ACAP エッジランタイム<\u002Fspan>\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">x402 v2 · exact · EIP-3009<\u002Fspan>\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">Base 上の USDC<\u002Fspan>\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">匿名 reverseProxy<\u002Fspan>\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">1 つの受取先、多数のカメラ<\u002Fspan>\n      <span style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">先行 digest = 12×<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRIVACY -->\n<section id=\"privacy\" data-screen-label=\"Privacy\" style=\"max-width:1240px;margin:0 auto;padding:110px 24px\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">03 / プライバシー · フィールド抽出<\u002Fdiv>\n  <h2 style=\"font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:900px;text-wrap:balance\">ペイロードではなく、1 つのフィールドを売る。<\u002Fh2>\n  <p style=\"font-size:18px;line-height:1.5;color:var(--ink2);max-width:640px;margin-top:22px;text-wrap:pretty\">AOA は「バスは何台か」に答えるが、同じレスポンスで何人が通り過ぎたかまで明かしてしまう。<code style=\"font-family:'JetBrains Mono',monospace;font-size:15px\">extract<\u002Fcode> は答えを購入されたものだけに絞り込む。書式の飾りではなく、プライバシーの制御である。<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:56px;align-items:center\">\n    <div style=\"background:var(--code-bg);color:var(--code-ink);border-radius:20px;padding:28px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.75;position:relative\">\n      <div style=\"font-size:11px;letter-spacing:.08em;opacity:.55;margin-bottom:12px\">カメラが知っていること · AOA レスポンス<\u002Fdiv>\n      <div>{<\u002Fdiv>\n      <div style=\"padding-left:20px;opacity:.45;text-decoration:line-through\">\"totalHuman\": <span>37<\u002Fspan>,<\u002Fdiv>\n      <div style=\"padding-left:20px;opacity:.45;text-decoration:line-through\">\"totalCar\": <span>12<\u002Fspan>,<\u002Fdiv>\n      <div style=\"padding-left:20px;opacity:.45;text-decoration:line-through\">\"totalBike\": <span>4<\u002Fspan>,<\u002Fdiv>\n      <div style=\"padding-left:20px;background:var(--accent-soft);color:var(--ink);border-radius:6px;margin:2px -6px;padding:2px 6px 2px 20px\">\"totalBus\": <span style=\"font-weight:600\">0<\u002Fspan>,<\u002Fdiv>\n      <div style=\"padding-left:20px;opacity:.45;text-decoration:line-through\">\"scenario\": \"Crossline-1\", …<\u002Fdiv>\n      <div>}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink2)\">\n      <div style=\"padding:8px 14px;border:1px solid var(--line);border-radius:999px\">extract: data.totalBus<\u002Fdiv>\n      <div style=\"font-size:34px;color:var(--accent-ink);line-height:1\">→<\u002Fdiv>\n      <div>0.001 USDC<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:28px;font-family:'JetBrains Mono',monospace;line-height:1.5\">\n      <div style=\"font-size:11px;letter-spacing:.08em;color:var(--ink2);margin-bottom:12px\">買い手が受け取るもの<\u002Fdiv>\n      <div style=\"font-size:clamp(22px,2.6vw,34px);font-weight:600;letter-spacing:-0.02em;word-break:break-word\">{\"value\": <span style=\"color:var(--accent-ink)\">0<\u002Fspan>,<br>\"unit\": <span style=\"color:var(--accent-ink)\">\"buses\"<\u002Fspan>}<\u002Fdiv>\n      <p style=\"font-family:Sora,'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:14px;color:var(--ink2);margin-top:18px;line-height:1.55\">買い手は何人が通り過ぎたかを決して知らない。あるいは実際に動いた例として、見知らぬウォレットが 44 KB の JPEG を 0.002 USDC で購入した — スナップショット全体を、それとして値付けして。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- GUARDRAILS -->\n<section id=\"guardrails\" data-screen-label=\"Guardrails\" style=\"background:var(--ink);color:var(--bg);position:relative;overflow:clip\">\n  <div ref=\"{{ guardCamRef }}\" style=\"position:absolute;right:-8%;top:6%;width:min(760px,60vw);opacity:.14;will-change:transform;pointer-events:none\"><img src=\"fbaf3d9b-c7eb-44d5-ab7a-053f8bdfa648\" alt=\"\" style=\"width:100%;display:block;filter:grayscale(1)\"><\u002Fdiv>\n  <div style=\"max-width:1240px;margin:0 auto;padding:110px 24px;position:relative\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.06em\">04 / 堅いガードレール · 検証済み<\u002Fdiv>\n    <h2 style=\"font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:820px;text-wrap:balance\">盗まれたカメラから資金は漏れない。再送された支払いは何も買えない。<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:oklch(1 0 0 / 0.14);margin-top:64px;border-radius:20px;overflow:hidden\">\n      <sc-for list=\"{{ guards }}\" as=\"g\" hint-placeholder-count=\"9\">\n        <div style=\"background:var(--ink);padding:28px 24px;display:flex;flex-direction:column;gap:14px;min-height:190px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent)\">{{ g.n }}<\u002Fdiv>\n          <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.015em;line-height:1.2\">{{ g.title }}<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.55;opacity:.7;text-wrap:pretty\">{{ g.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CAPABILITIES -->\n<section data-screen-label=\"Capabilities\" style=\"max-width:1240px;margin:0 auto;padding:110px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;align-items:center\">\n  <div>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">05 / 今日動いているもの<\u002Fdiv>\n    <h2 style=\"font-size:clamp(34px,4vw,56px);line-height:1.02;letter-spacing:-0.03em;font-weight:800;margin-top:16px;text-wrap:balance\">いまカメラが売れるもの<\u002Fh2>\n    <div style=\"display:grid;gap:10px;margin-top:36px\">\n      <sc-for list=\"{{ caps }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:var(--accent)\"><\u002Fspan>\n          <span style=\"font-size:16px;font-weight:500\">{{ c.title }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2)\">{{ c.meta }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div ref=\"{{ capCamRef }}\" style=\"will-change:transform\"><img src=\"a36eaf77-f103-4bbc-8bcf-d2b314260741\" alt=\"AXIS M11-37 Mk II ボックスカメラ\" style=\"width:100%;display:block;filter:drop-shadow(0 30px 40px oklch(0 0 0 / 0.2))\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- BUYERS -->\n<section id=\"buyers\" data-screen-label=\"Buyers\" style=\"background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:110px 24px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">06 / 誰がなぜ払うのか<\u002Fdiv>\n    <h2 style=\"font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:820px;text-wrap:balance\">4 種類の買い手、1 台のカメラ。<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:64px\">\n      <sc-for list=\"{{ buyers }}\" as=\"b\" hint-placeholder-count=\"4\">\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;min-height:260px\">\n          <h3 style=\"font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.15\">{{ b.who }}<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);text-wrap:pretty\">{{ b.value }}<\u002Fp>\n          <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink2)\">商流<\u002Fdiv>\n            <div style=\"font-size:18px;font-weight:600;color:var(--accent-ink)\">{{ b.path }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin-top:32px;max-width:760px;text-wrap:pretty\">価格はルールごと、USDC の最小単位で表記（1000 = 0.001 USDC）。目安：開発用途は 1 呼び出しあたり €0.02〜€0.20、業種別の運用パックは 1 サイトあたり月額 €99〜€499。<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- OWNER UI -->\n<section data-screen-label=\"Owner UI\" style=\"max-width:1240px;margin:0 auto;padding:110px 24px\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-ink);letter-spacing:.06em\">07 / オーナーに見えるもの<\u002Fdiv>\n  <h2 style=\"font-size:clamp(34px,4vw,56px);line-height:1.02;letter-spacing:-0.03em;font-weight:800;margin-top:16px;max-width:820px;text-wrap:balance\">設定ページは 1 つ、カメラ自身の管理者ログインの内側に。<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:56px\">\n    <sc-for list=\"{{ shots }}\" as=\"sh\" hint-placeholder-count=\"6\">\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:14px\">\n        <img src=\"{{ sh.src }}\" alt=\"{{ sh.alt }}\" loading=\"lazy\" style=\"aspect-ratio:16/10;width:100%;object-fit:cover;object-position:top;border-radius:16px;border:1px solid var(--line);background:var(--bg2);display:block\">\n        <figcaption style=\"font-size:14px;line-height:1.55;color:var(--ink2)\"><strong style=\"color:var(--ink)\">{{ sh.title }}<\u002Fstrong> {{ sh.body }}<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STATUS -->\n<section id=\"status\" data-screen-label=\"Status\" style=\"max-width:1240px;margin:0 auto;padding:40px 24px 110px\">\n  <div style=\"border:1px solid var(--warn);border-radius:20px;padding:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;background:color-mix(in oklch,var(--warn) 8%,var(--card))\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--warn);letter-spacing:.06em\">ステータス · 製品ではなくプロトタイプ<\u002Fdiv>\n      <h2 style=\"font-size:clamp(26px,3vw,38px);line-height:1.1;letter-spacing:-0.025em;font-weight:700;margin-top:14px;text-wrap:balance\">ここにあるすべては、1 台の AXIS Q1656 上で Base Sepolia に対して動いている。主張はそれだけ。<\u002Fh2>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin-top:16px\">署名なしのラボビルド、テストネットのみ、カメラ 1 台、パイロット顧客なし、メインネットの資金なし。ここにあるものは、ソフトウェア販売の申し出でも、本番対応の主張でもない。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:10px;font-size:15px;line-height:1.5;align-content:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--ink2)\">対象外 / 未解決<\u002Fdiv>\n      <div>アクセス制御ではない — 資格情報を持つユーザーは今も VAPIX と RTSP に直接到達できる<\u002Fdiv>\n      <div>まだインターネットには公開していない — Axis Device ID の証明書 isn't publicly trusted<\u002Fdiv>\n      <div>メインネットなし、クォータパックなし、法的・法科学的な証拠能力の主張もなし<\u002Fdiv>\n      <div>決済失敗：直近 18 件の購入で 0 件。ただし <em>再現しない<\u002Fem> ≠ 直った<\u002Fdiv>\n      <div style=\"margin-top:10px;padding-top:14px;border-top:1px solid var(--line);font-weight:600\">次：実際の買い手向けに堅牢化し、リバースプロキシ経由で公的に信頼される証明書を用意し、その後 Base メインネットで有償パイロットを 1 件。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid var(--line)\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:36px 24px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--ink2)\">\n    <div>Pavel Kotyza · <a href=\"https://4xs.dev\">4xs.dev<\u002Fa><\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">CamWallet 0.8.2 · x402 v2 exact · USDC · Base Sepolia<\u002Fdiv>\n    <div style=\"display:flex;gap:14px\"><a href=\"https://kotyzap.github.io/Sell-answers-not-video---x402-for-Axis/ja/\">日本語<\u002Fa><a href=\"https://kotyzap.github.io/Sell-answers-not-video---x402-for-Axis/cs/\">Čeština<\u002Fa><a href=\"https://github.com/kotyzap/Sell-answers-not-video---x402-for-Axis\">GitHub<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'system'|'light'|'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  heroCamRef = React.createRef(); heroTagRef = React.createRef(); archCamRef = React.createRef(); guardCamRef = React.createRef(); capCamRef = React.createRef();\n  componentDidMount() {\n    const k = () => this.props.parallax ?? 1;\n    const onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = 0;\n        const y = window.scrollY, vh = window.innerHeight;\n        const rel = (el) => { const r = el.getBoundingClientRect(); return (r.top + r.height / 2 - vh / 2) / vh; };\n        const mv = (ref, f, extra) => { const el = ref.current; if (!el) return; const d = rel(el) * f * k(); el.style.transform = `translate3d(0,${d.toFixed(1)}px,0)${extra || ''}`; };\n        mv(this.heroCamRef, -70); mv(this.heroTagRef, 60); mv(this.archCamRef, -120, ' rotate(-6deg)'); mv(this.guardCamRef, -160); mv(this.capCamRef, 60);\n      });\n    };\n    this._onScroll = onScroll; window.addEventListener('scroll', onScroll, { passive: true }); window.addEventListener('resize', onScroll); onScroll();\n  }\n  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); window.removeEventListener('resize', this._onScroll); }\n  renderVals() {\n    return {\n      theme: this.props.theme ?? 'light',\n      heroCamRef: this.heroCamRef, heroTagRef: this.heroTagRef, archCamRef: this.archCamRef, guardCamRef: this.guardCamRef, capCamRef: this.capCamRef,\n      steps: [\n        { n: '01', tag: 'リクエスト', code: 'GET', title: 'エージェントが尋ねる', body: 'オーナーがカタログで公開したパスを叩く。既定は拒否、完全一致、グロブなし。' },\n        { n: '02', tag: 'チャレンジ', code: '402', title: 'ACAP が応答する', body: '標準のボディ：ルールごとの価格、asset、chain、payTo。まだ何も請求されない。' },\n        { n: '03', tag: '認可', code: 'SIG', title: 'エージェントが支払う', body: '署名済みの PAYMENT-SIGNATURE ヘッダーを付けて再試行する。カメラは鍵を持たない。' },\n        { n: '04', tag: '検証', code: '✓', title: 'ファシリテーターが決済する', body: '/verify のあと /settle。リース、クールダウン、レート制限はキャプチャ前に確認される。' },\n        { n: '05', tag: '配信', code: '200', title: 'カメラが返す', body: 'authorize → produce → capture。渡さなければ課金しない。' }\n      ],\n      guards: [\n        { n: '01', title: 'カメラに鍵はない', body: '受取アドレスは管理者が貼り付ける。x402 の受け取りにはアドレスだけあればよい。' },\n        { n: '02', title: '上書きできない拒否リスト', body: 'オーナーの設定に関係なく、危険なパス 10/10 を拒否。' },\n        { n: '03', title: 'パス ≠ ターゲット', body: '買い手は公開されたパスを呼ぶ。カタログがカメラ側のターゲットを公開することはない。' },\n        { n: '04', title: 'extract は 1 つのフィールドを売る', body: '答えはペイロード全体ではなく、購入されたものに絞られる。' },\n        { n: '05', title: 'フェイルクローズ', body: 'ファシリテーターに到達不能 → 402。何も提供せず、何も請求しない。' },\n        { n: '0
